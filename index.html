<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fridge Bot Scanner</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #0b0f17;
        color: #e5e7eb;
      }
      .wrap { padding: 16px; max-width: 720px; margin: 0 auto; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { margin: 0 0 12px; color: #9ca3af; font-size: 13px; }
      .card {
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 12px;
      }
      #reader { width: 100%; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
      button {
        background: #2563eb;
        border: 0;
        color: white;
        padding: 10px 12px;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        font-size: 14px;
      }
      button.secondary { background: #374151; }
      button.danger { background: #dc2626; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .value {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        background: #0b1220;
        border: 1px solid #1f2937;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        word-break: break-all;
      }
      .hint { margin-top: 10px; font-size: 12px; color: #9ca3af; }
      .product-list { margin-top: 12px; }
      .product-item {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px;
        background: #0b1220;
        border: 1px solid #1f2937;
        border-radius: 8px;
        margin-bottom: 8px;
      }
      .product-item input {
        flex: 1;
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 6px;
        padding: 8px 10px;
        color: #e5e7eb;
        font-size: 14px;
      }
      .product-item input:focus {
        outline: none;
        border-color: #2563eb;
      }
      .product-item .code {
        font-family: monospace;
        font-size: 11px;
        color: #9ca3af;
        min-width: 100px;
      }
      .product-item button {
        padding: 6px 10px;
        font-size: 12px;
      }
      .empty { color: #6b7280; font-style: italic; text-align: center; padding: 20px; }
      .count { color: #9ca3af; font-size: 13px; margin-top: 8px; }
      #scanSection { display: block; }
      #listSection { display: none; }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="html5-qrcode.min.js"></script>
  </head>
  <body>
    <div class="wrap">
      <h1>📷 Сканер продуктов</h1>
      <p>Наведи камеру на штрихкод. Продукты накапливаются в списке — можно редактировать названия перед отправкой.</p>

      <!-- Секция сканирования -->
      <div id="scanSection" class="card">
        <div id="reader"></div>
        <div class="row">
          <button id="btnStart">▶️ Запустить камеру</button>
          <button id="btnStop" class="secondary" disabled>⏹️ Остановить</button>
          <button id="btnToList" class="secondary">📋 К списку</button>
        </div>
        <div class="hint" id="status">Готов к запуску.</div>
      </div>

      <!-- Секция списка -->
      <div id="listSection" class="card">
        <h2>📝 Список продуктов</h2>
        <div class="count" id="count">0 продуктов</div>
        <div class="product-list" id="productList">
          <div class="empty">Список пуст. Сканируйте продукты.</div>
        </div>
        <div class="row">
          <button id="btnBackToScan" class="secondary">➕ Добавить ещё</button>
          <button id="btnSend" disabled>� Копировать список</button>
          <button id="btnClear" class="danger">🗑️ Очистить</button>
        </div>
      </div>
    </div>

    <script>
      const tg = window.Telegram?.WebApp;
      if (tg) {
        tg.expand();
        tg.ready();
      }

      // Состояние
      let products = [];
      let html5Qr = null;
      let isScanning = false;
      let pendingProduct = null;
      
      // URL Google Apps Script API
      const API_URL = 'https://script.google.com/macros/s/AKfycbyDM2XXgQL18zS-06XG_9vXIz0B1L2EJPALIIisxCsyz2b0ikDmgyNfCZG8-PdaXb1JCw/exec';

      // DOM элементы
      const statusEl = document.getElementById('status');
      const productListEl = document.getElementById('productList');
      const countEl = document.getElementById('count');
      const btnStart = document.getElementById('btnStart');
      const btnStop = document.getElementById('btnStop');
      const btnToList = document.getElementById('btnToList');
      const btnBackToScan = document.getElementById('btnBackToScan');
      const btnSend = document.getElementById('btnSend');
      const btnClear = document.getElementById('btnClear');
      const scanSection = document.getElementById('scanSection');
      const listSection = document.getElementById('listSection');

      function setStatus(msg) { statusEl.textContent = msg; }

      // Переключение секций
      function showScan() {
        scanSection.style.display = 'block';
        listSection.style.display = 'none';
      }

      function showList() {
        scanSection.style.display = 'none';
        listSection.style.display = 'block';
        renderProducts();
      }

      // Поиск названия продукта по коду
      async function lookupProductName(code) {
        let gtin = '';
        
        // Вариант 1: Честный ЗНАК (DataMatrix) - извлекаем GTIN
        // Формат: 01<GTIN>21<...> или с разделителями GS (ASCII 29)
        if (code.includes('\x1D') || code.startsWith('01') || /^(\d{14,})/.test(code)) {
          // Ищем GTIN после 01 или просто первые 8-14 цифр
          const match = code.match(/01(\d{14})/) || code.match(/01(\d{13})/) || code.match(/(\d{13,14})/);
          if (match) {
            gtin = match[1];
            console.log('Extracted GTIN from DataMatrix:', gtin);
          }
        }
        
        // Вариант 2: Обычный EAN-13/UPC - просто цифры
        if (!gtin) {
          const digits = code.replace(/\D/g, '');
          if (digits.length >= 8 && digits.length <= 14) {
            gtin = digits;
          }
        }
        
        // Поиск в OpenFoodFacts
        if (gtin) {
          try {
            const resp = await fetch(`https://world.openfoodfacts.org/api/v0/product/${gtin}.json`);
            const data = await resp.json();
            if (data.status === 1 && data.product?.product_name) {
              return data.product.product_name;
            }
          } catch (e) {
            console.log('Lookup failed:', e);
          }
        }
        
        return '';
      }

      async function lookupInSheets(gtin) {
        if (!API_URL || !gtin) return '';
        try {
          const resp = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'lookup', code: gtin })
          });
          const data = await resp.json();
          if (data && data.found && data.name) return String(data.name);
        } catch (e) {
          console.log('Sheets lookup failed:', e);
        }
        return '';
      }

      // Показать диалог ввода названия
      function showNameDialog(gtin, suggestedName = '') {
        pendingProduct = { gtin, suggestedName };
        
        // Останавливаем камеру
        stop();
        
        // Создаем модальное окно
        const modal = document.createElement('div');
        modal.id = 'nameModal';
        modal.innerHTML = `
          <div style="
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
          ">
            <div style="
              background: #111827;
              border: 1px solid #1f2937;
              border-radius: 14px;
              padding: 20px;
              max-width: 320px;
              width: 90%;
            ">
              <h3 style="margin: 0 0 12px; font-size: 16px;">📝 Введите название</h3>
              <p style="color: #9ca3af; font-size: 13px; margin: 0 0 12px;">
                Код: <code style="background: #0b1220; padding: 2px 6px; border-radius: 4px;">${gtin}</code>
              </p>
              <input 
                type="text" 
                id="nameInput" 
                value="${suggestedName}" 
                placeholder="Например: Молоко 3.2% 1л" 
                style="
                  width: 100%;
                  box-sizing: border-box;
                  background: #0b1220;
                  border: 1px solid #374151;
                  border-radius: 8px;
                  padding: 12px;
                  color: #e5e7eb;
                  font-size: 14px;
                  margin-bottom: 12px;
                "
              >
              <div style="display: flex; gap: 8px;">
                <button onclick="cancelAdd()" style="flex:1; background: #374151;">Отмена</button>
                <button onclick="confirmAdd()" style="flex:1; background: #2563eb;">Добавить</button>
              </div>
            </div>
          </div>
        `;
        document.body.appendChild(modal);
        
        // Фокус на поле ввода
        setTimeout(() => {
          const input = document.getElementById('nameInput');
          input.focus();
          input.select();
        }, 100);
      }
      
      // Отмена добавления
      window.cancelAdd = function() {
        const modal = document.getElementById('nameModal');
        if (modal) modal.remove();
        pendingProduct = null;
        setStatus('❌ Отменено');
      };
      
      // Подтверждение добавления
      window.confirmAdd = async function() {
        const input = document.getElementById('nameInput');
        const name = input?.value?.trim();
        
        if (!name) {
          alert('Введите название продукта!');
          return;
        }
        
        if (pendingProduct) {
          // Сохраняем в Google Sheets
          if (API_URL) {
            try {
              await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  code: pendingProduct.gtin,
                  name: name,
                  action: 'save'
                })
              });
            } catch(e) {
              console.log('Save to Sheets failed:', e);
            }
          }
          
          // Добавляем в список
          products.push({
            code: pendingProduct.gtin,
            name: name,
            id: Date.now() + Math.random()
          });
          
          // Убираем модалку
          const modal = document.getElementById('nameModal');
          if (modal) modal.remove();
          
          setStatus(`✅ Добавлен: ${name}`);
          showList();
          pendingProduct = null;
        }
      };

      // Добавление продукта
      async function addProduct(code) {
        // Проверка на дубликат
        if (products.some(p => p.code === code)) {
          setStatus('⚠️ Этот код уже в списке');
          return;
        }

        // Извлекаем GTIN
        let gtin = '';
        const dmMatch = code.match(/01(\d{14})/) || code.match(/01(\d{13})/);
        if (dmMatch) {
          gtin = dmMatch[1];
        } else {
          const digits = code.replace(/\D/g, '');
          if (digits.length >= 8 && digits.length <= 14) gtin = digits;
        }
        
        if (!gtin) {
          gtin = code.substring(0, 20);
        }

        // Сначала пробуем найти в Google Sheets (лист barcodes)
        setStatus('🔎 Ищу в твоей базе...');
        const sheetName = await lookupInSheets(gtin);
        if (sheetName) {
          products.push({ code: gtin, name: sheetName, id: Date.now() + Math.random() });
          setStatus(`✅ Найдено в базе: ${sheetName}`);
          setTimeout(() => showList(), 300);
          return;
        }

        // Пробуем найти в OpenFoodFacts
        setStatus('🔍 Ищу в международной базе...');
        const onlineName = await lookupProductName(code);
        
        if (onlineName) {
          // Нашли онлайн — добавляем сразу
          products.push({ code: gtin, name: onlineName, id: Date.now() + Math.random() });
          setStatus(`✅ Найдено: ${onlineName}`);
          setTimeout(() => showList(), 300);
          return;
        }
        
        // Не нашли — показываем диалог ввода (обязательно)
        showNameDialog(gtin, '');
      }

      // Рендер списка
      function renderProducts() {
        if (products.length === 0) {
          productListEl.innerHTML = '<div class="empty">Список пуст. Сканируйте продукты.</div>';
          countEl.textContent = '0 продуктов';
          btnSend.disabled = true;
          return;
        }

        countEl.textContent = `${products.length} ${products.length === 1 ? 'продукт' : products.length < 5 ? 'продукта' : 'продуктов'}`;
        btnSend.disabled = false;

        productListEl.innerHTML = products.map((p, idx) => `
          <div class="product-item" data-id="${p.id}">
            <span class="code">${p.code}</span>
            <input type="text" value="${p.name || ''}" placeholder="Название продукта" onchange="updateName(${p.id}, this.value)">
            <button class="danger" onclick="removeProduct(${p.id})">✕</button>
          </div>
        `).join('');
      }

      // Обновление названия
      window.updateName = function(id, newName) {
        const p = products.find(x => x.id === id);
        if (p) p.name = newName.trim();
      };

      // Удаление продукта
      window.removeProduct = function(id) {
        products = products.filter(x => x.id !== id);
        renderProducts();
      };

      // Запуск камеры
      async function start() {
        try {
          if (!html5Qr) {
            html5Qr = new Html5Qrcode('reader');
          }

          setStatus('Запуск камеры...');
          btnStart.disabled = true;
          isScanning = true;

          const config = {
            fps: 10,
            qrbox: { width: 250, height: 250 },
            rememberLastUsedCamera: true
          };

          await html5Qr.start(
            { facingMode: 'environment' },
            config,
            (decodedText) => {
              if (!decodedText || !isScanning) return;
              addProduct(decodedText);
            },
            () => {}
          );

          btnStop.disabled = false;
          setStatus('Камера запущена. Наведите на штрихкод.');
        } catch (e) {
          isScanning = false;
          btnStart.disabled = false;
          btnStop.disabled = true;
          setStatus('Ошибка: ' + (e?.message || String(e)));
        }
      }

      // Остановка камеры
      async function stop() {
        try {
          if (!html5Qr) return;
          await html5Qr.stop();
          await html5Qr.clear();
          isScanning = false;
          btnStart.disabled = false;
          btnStop.disabled = true;
          setStatus('Камера остановлена.');
        } catch (e) {
          setStatus('Ошибка остановки: ' + (e?.message || String(e)));
        }
      }

      // Копирование в буфер обмена
      async function send() {
        if (products.length === 0) return;
        
        // Формируем текст для бота: каждый продукт с новой строки
        const lines = products.map(p => {
          const name = p.name || 'Неизвестный продукт';
          return `+ ${name} 1 шт`;
        }).join('\n');
        
        try {
          await navigator.clipboard.writeText(lines);
          
          // Показываем уведомление
          const btn = document.getElementById('btnSend');
          const originalText = btn.textContent;
          btn.textContent = '✅ Скопировано!';
          btn.style.background = '#16a34a';
          setStatus('✅ Список скопирован! Вставь в чат с ботом.');
          
          setTimeout(() => {
            btn.textContent = originalText;
            btn.style.background = '';
          }, 2000);
          
        } catch (err) {
          // Fallback для старых браузеров
          const textarea = document.createElement('textarea');
          textarea.value = lines;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          
          try {
            document.execCommand('copy');
            setStatus('✅ Список скопирован! Вставь в чат с ботом.');
          } catch (e) {
            alert('Не удалось скопировать. Скопируйте вручную:\n\n' + lines);
          }
          
          document.body.removeChild(textarea);
        }
      }

      // Очистка списка
      function clear() {
        if (products.length === 0) return;
        if (confirm('Очистить список?')) {
          products = [];
          renderProducts();
          showScan();
        }
      }

      // Event listeners
      btnStart.addEventListener('click', start);
      btnStop.addEventListener('click', stop);
      btnToList.addEventListener('click', showList);
      btnBackToScan.addEventListener('click', showScan);
      btnSend.addEventListener('click', send);
      btnClear.addEventListener('click', clear);
    </script>
  </body>
</html>
